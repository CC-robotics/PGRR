schema_version: 1
benchmark_id: pgrr_advantage_screen_v1
scope: independent_validation_gate
frozen_before_execution: true
scenario_family: crossing_flow_medium_anchor_v2
route_distance_m: 15.0
episode_timeout_s: 90
methods: [base, pgrr]
validation_replicates:
  - {replicate: 0, seed: 96000, config: configs/experiments/pgrr_advantage_screen_crossing_v2_validation_r00.yaml}
  - {replicate: 1, seed: 96001, config: configs/experiments/pgrr_advantage_screen_crossing_v2_validation_r01.yaml}
  - {replicate: 2, seed: 96002, config: configs/experiments/pgrr_advantage_screen_crossing_v2_validation_r02.yaml}
promotion_rule:
  minimum_positive_pairs: 2
  total_pairs: 3
  positive_pair: base_not_goal_and_pgrr_goal
  infrastructure_retry:
    allowed_outcomes: [SIMULATOR_FAILURE, INVALID_RESET]
    maximum_same_seed_retries_per_method: 1
    preserve_every_attempt: true
  no_seed_replacement: true
  no_threshold_tuning: true
  no_geometry_change: true
  no_timeout_change: true
  validation_is_terminal_for_this_design: true
held_out_test_materialized: false

