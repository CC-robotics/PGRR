[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-ml"
version = "0.1.0"
description = "Learning components for constrained navigation recovery"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2", "ramp-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ramp_ml*"]
