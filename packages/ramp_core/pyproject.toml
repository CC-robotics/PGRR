[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-core"
version = "0.1.0"
description = "ROS-independent planning and recovery primitives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pydantic>=2", "PyYAML>=6", "shapely>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ramp_core*"]
